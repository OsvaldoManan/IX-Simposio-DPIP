<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación de ponencias | IX Simposio DPIP 2026</title>
<meta name="description" content="Formulario de evaluación de ponencias por mesa del IX Simposio DPIP 2026: tres preguntas por ponencia en escala de 0 a 5 y elección de la mejor ponencia.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="css/votacion.css?v=3">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="js/config-votacion.js?v=4"></script>
<script src="js/mesas.js?v=3"></script>
<script src="js/firebase-config.js?v=3"></script>
<script src="js/votacion.js?v=3"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark">IX</span>
    <span><small>Simposio DPIP 2026</small><strong>Anatomía del presente</strong></span>
  </a>
  <nav>
    <a href="index.html#baremo">Volver al sitio</a>
  </nav>
</header>

<main class="shell">
  <div class="card" id="app">
    <p class="intro">Cargando…</p>
  </div>
</main>

<script>
(function () {
  const V = window.Votacion;
  const esc = V.escapeHtml;
  const app = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  const mesa = V.mesa(params.get("mesa"));
  const PREGUNTAS = V.PREGUNTAS;
  const ESCALA = V.ESCALA;
  const respuestas = {};   // codigo -> {c, r, f}
  let mejor = null;
  let paso = 0;            // 0 intro · 1..4 ponentes · 5 mejor ponencia
  let enviando = false;

  function modeNote() {
    return V.mode === "demo"
      ? '<div class="mode-note demo"><strong>Modo demostración.</strong> Las respuestas se guardan solo en este dispositivo.</div>'
      : '<div class="mode-note">Evaluación anónima. Se admite una evaluación por mesa y por dispositivo.</div>';
  }
  function bindLogout() {}

  const escalaHtml = '<ul class="scale-legend" aria-label="Escala">' + ESCALA.map((t, i) => '<li><b>' + i + '</b>' + t + '</li>').join("") + '</ul>';

  function etiquetaEstado(n) {
    const e = window.estadoVotacionMesa(n);
    if (e.estado === "abierta") return { cls: "abierta", txt: "Abierta ahora · hasta las " + window.horaVotacion(e.cierra) };
    if (e.estado === "proxima") return { cls: "proxima", txt: "Abre a las " + window.horaVotacion(e.abre) };
    return { cls: "cerrada", txt: "Evaluación cerrada" };
  }

  function renderSelector() {
    app.innerHTML =
      '<p class="eyebrow">Evaluación de ponencias · IX Simposio DPIP 2026</p>' +
      '<h1 class="title">Elige la mesa que quieres evaluar.</h1>' +
      '<p class="intro">Cada mesa se abre según el cronograma, desde su inicio hasta 30 minutos después de su término. Cada mesa tiene además su propio código QR.</p>' +
      '<div class="mesa-picker">' +
      V.mesas.map((m) => { const e = etiquetaEstado(m.numero); return '<a class="picker-' + e.cls + '" href="evaluar.html?mesa=' + m.numero + '"><span>Mesa ' + m.numero + ' · ' + esc(m.horario) + '</span><strong>' + esc(m.titulo) + '</strong><small>Modera ' + esc(m.moderacion) + '</small><em class="estado-mesa estado-' + e.cls + '">' + esc(e.txt) + '</em></a>'; }).join("") +
      '</div>' + modeNote();
  }

  function renderNoDisponible(e) {
    document.title = "Evaluar · Mesa " + mesa.numero + " | IX Simposio DPIP 2026";
    const proxima = e.estado === "proxima";
    app.innerHTML =
      '<p class="eyebrow">Evaluación de ponencias · Mesa ' + mesa.numero + ' · ' + esc(mesa.horario) + '</p>' +
      '<h1 class="title">' + esc(mesa.titulo) + '</h1>' +
      '<div class="estado-box estado-' + e.estado + '"><strong>' + (proxima ? "Esta mesa abre a las " + window.horaVotacion(e.abre) : "La evaluación de esta mesa ya cerró") + '</strong>' +
      '<p>' + (proxima ? "El formulario se habilita automáticamente al inicio de la mesa, según el cronograma. Deja esta página abierta: se activará sola." : "Cada mesa se puede evaluar hasta 30 minutos después de su término. Gracias por acompañarnos.") + '</p></div>' +
      '<div class="actions"><a class="button" href="evaluar.html">Ver todas las mesas</a><a class="button button-ghost" href="index.html#programa">Ver programa</a></div>';
    if (proxima) {
      const ms = e.abre.getTime() - Date.now() + 1500;
      if (ms > 0 && ms < 12 * 3600000) setTimeout(() => location.reload(), ms);
    }
  }

  function renderCerrada() {
    app.innerHTML =
      '<p class="eyebrow">Evaluación de ponencias · IX Simposio DPIP 2026</p>' +
      '<h1 class="title">La evaluación se abrirá el 24 de septiembre.</h1>' +
      '<p class="intro">El formulario de cada mesa se habilita durante la jornada, desde la ronda de preguntas hasta unos 30 minutos después. Guarda este enlace o vuelve a escanear el código QR ese día.</p>' +
      '<div class="actions"><a class="button" href="index.html#programa">Ver programa</a><a class="button button-ghost" href="index.html">Volver al sitio</a></div>';
  }

  function progreso() {
    const total = mesa.ponencias.length + 2;
    return '<div class="steps" aria-label="Progreso"><span class="steps-bar"><i style="width:' + Math.round((paso / (total - 1)) * 100) + '%"></i></span><small>Paso ' + (paso + 1) + ' de ' + total + '</small></div>';
  }

  function cabecera() {
    return '<div class="card-head"><p class="eyebrow">Evaluación de ponencias · Mesa ' + mesa.numero + ' · ' + esc(mesa.horario) + '</p><span class="badge badge-live"><span class="live-dot"></span> Formulario abierto</span></div>';
  }

  function renderIntro() {
    app.innerHTML = cabecera() + progreso() +
      '<h1 class="title">' + esc(mesa.titulo) + '</h1>' +
      '<p class="meta"><span>Modera ' + esc(mesa.moderacion) + '</span><span>' + mesa.ponencias.length + ' ponencias · 3 preguntas por ponencia</span></p>' +
      '<p class="intro">En cada página evaluarás una ponencia con tres preguntas en una escala de 0 a 5. Al final votarás por la mejor ponencia de la mesa. Toma unos cinco minutos.</p>' +
      '<div class="scale-box"><strong>Escala de respuesta</strong>' + escalaHtml + '</div>' +
      '<ol class="speaker-list">' + mesa.ponencias.map((p, i) => '<li><span>0' + (i + 1) + '</span><div><strong>' + esc(p.autor) + '</strong><small>' + esc(p.titulo) + '</small></div></li>').join("") + '</ol>' +
      '<div class="actions"><button type="button" class="button" id="next">Comenzar evaluación</button></div>' + modeNote();
    bindLogout();
    document.getElementById("next").addEventListener("click", () => { paso = 1; render(); });
  }

  function renderPonente(i) {
    const p = mesa.ponencias[i - 1];
    const r = respuestas[p.codigo] || {};
    app.innerHTML = cabecera() + progreso() +
      '<p class="speaker-tag">Ponente ' + i + ' de ' + mesa.ponencias.length + '</p>' +
      '<h1 class="title title-sm">' + esc(p.autor) + '</h1>' +
      '<p class="meta"><span>' + esc(p.afiliacion) + '</span></p>' +
      '<p class="paper-title">«' + esc(p.titulo) + '»</p>' +
      PREGUNTAS.map((q, qi) =>
        '<fieldset class="question" data-key="' + q.key + '"><legend><small>Pregunta ' + (qi + 1) + ' · ' + esc(q.nombre) + '</small>' + esc(q.texto) + '</legend>' +
        '<div class="scale" role="radiogroup" aria-label="' + esc(q.nombre) + '"><span class="scale-end">Nada</span>' +
        [0, 1, 2, 3, 4, 5].map((v) => '<button type="button" role="radio" aria-checked="' + (r[q.key] === v ? "true" : "false") + '" data-v="' + v + '" title="' + esc(ESCALA[v]) + '">' + v + '</button>').join("") +
        '<span class="scale-end">Totalmente</span></div><small class="scale-hint">' + (r[q.key] !== undefined ? esc(ESCALA[r[q.key]]) : "&nbsp;") + '</small></fieldset>'
      ).join("") +
      '<div class="actions"><button type="button" class="button button-ghost" id="prev">Anterior</button><button type="button" class="button" id="next" ' + (completo(p.codigo) ? "" : "disabled") + '>' + (i === mesa.ponencias.length ? "Ir a la pregunta final" : "Siguiente ponente") + '</button></div>' +
      '<p class="status" id="status"></p>';
    app.querySelectorAll(".question").forEach((fs) => {
      const key = fs.dataset.key;
      fs.querySelectorAll("button[role=radio]").forEach((b) => b.addEventListener("click", () => {
        const v = Number(b.dataset.v);
        respuestas[p.codigo] = Object.assign({}, respuestas[p.codigo], { [key]: v });
        fs.querySelectorAll("button[role=radio]").forEach((o) => o.setAttribute("aria-checked", o === b ? "true" : "false"));
        fs.querySelector(".scale-hint").textContent = ESCALA[v];
        document.getElementById("next").disabled = !completo(p.codigo);
      }));
    });
    document.getElementById("prev").addEventListener("click", () => { paso -= 1; render(); });
    document.getElementById("next").addEventListener("click", () => { if (completo(p.codigo)) { paso += 1; render(); } });
  }

  function completo(codigo) {
    const r = respuestas[codigo];
    return !!r && PREGUNTAS.every((q) => typeof r[q.key] === "number");
  }

  function renderFinal() {
    app.innerHTML = cabecera() + progreso() +
      '<p class="speaker-tag">Pregunta final · Mejor ponencia del panel</p>' +
      '<h1 class="title title-sm">De las cuatro ponencias de esta mesa, ¿cuál consideras que fue la mejor?</h1>' +
      '<p class="intro">Selecciona solo una. Es tu voto por la mejor ponencia de la mesa y otorga además un puntaje extra a la ponencia elegida.</p>' +
      '<div class="options" role="radiogroup" aria-label="Mejor ponencia">' +
      mesa.ponencias.map((p, i) =>
        '<button type="button" class="option" role="radio" aria-checked="' + (mejor === p.codigo ? "true" : "false") + '" data-codigo="' + esc(p.codigo) + '"><span class="radio" aria-hidden="true"></span>' +
        '<span><span class="num">Ponencia 0' + (i + 1) + '</span><span class="autor">' + esc(p.autor) + '</span><span class="tit">' + esc(p.titulo) + '</span></span></button>'
      ).join("") + '</div>' +
      '<div class="actions"><button type="button" class="button button-ghost" id="prev">Anterior</button><button type="button" class="button" id="enviar" ' + (mejor ? "" : "disabled") + '>Enviar evaluación</button></div>' +
      '<p class="status" id="status" aria-live="polite"></p>' + modeNote();
    const opciones = [...app.querySelectorAll(".option")];
    opciones.forEach((btn) => btn.addEventListener("click", () => {
      if (enviando) return;
      mejor = btn.dataset.codigo;
      opciones.forEach((o) => o.setAttribute("aria-checked", o === btn ? "true" : "false"));
      document.getElementById("enviar").disabled = false;
    }));
    document.getElementById("prev").addEventListener("click", () => { paso -= 1; render(); });
    document.getElementById("enviar").addEventListener("click", enviar);
  }

  async function enviar() {
    if (!mejor || enviando) return;
    if (!mesa.ponencias.every((p) => completo(p.codigo))) { paso = 1; render(); return; }
    const status = document.getElementById("status");
    const btn = document.getElementById("enviar");
    enviando = true; btn.disabled = true;
    status.className = "status"; status.textContent = "Enviando tu evaluación…";
    const payload = { p: {}, mejor: mejor };
    mesa.ponencias.forEach((p) => { const r = respuestas[p.codigo]; payload.p[p.codigo] = { c: r.c, r: r.r, f: r.f }; });
    try {
      await V.evaluate(mesa.key, payload);
      try { localStorage.setItem("ixdpip-eval-v2-" + mesa.key, String(V.uid())); } catch (e) {}
      renderListo(false);
    } catch (err) {
      enviando = false;
      if (err && (err.message === "already-evaluated" || err.code === "PERMISSION_DENIED")) { renderListo(true); return; }
      status.className = "status error";
      status.textContent = "No pudimos enviar la evaluación. " + (err && err.message ? err.message : "Revisa tu conexión e inténtalo otra vez.");
      btn.disabled = false; btn.textContent = "Reintentar";
    }
  }

  function renderListo(previo) {
    app.innerHTML =
      '<p class="eyebrow">Evaluación de ponencias · Mesa ' + mesa.numero + '</p>' +
      '<h1 class="title">' + esc(mesa.titulo) + '</h1>' +
      '<div class="done"><span class="badge badge-ok">' + (previo ? "Ya evaluaste esta mesa" : "Evaluación enviada") + '</span>' +
      '<h2>' + (previo ? "Tu evaluación ya estaba registrada." : "¡Gracias por evaluar!") + '</h2>' +
      '<p>' + (previo ? "Solo se admite una evaluación por mesa y por dispositivo." : "Tus respuestas son anónimas y tu voto por la mejor ponencia quedó registrado.") + ' Los resultados se anunciarán en la ceremonia de clausura y premiación.</p>' +
      '<div class="actions"><a class="button button-light" href="index.html#programa">Ver programa</a><a class="button button-ghost" href="index.html">Volver al sitio</a></div></div>' + modeNote();
    bindLogout();
  }

  function render() {
    window.scrollTo({ top: 0, behavior: "instant" });
    if (paso === 0) renderIntro();
    else if (paso <= mesa.ponencias.length) renderPonente(paso);
    else renderFinal();
  }

  async function iniciar() {
    if (window.VOTACION_HABILITADA === false && params.get("preview") !== "1") return renderCerrada();
    if (!mesa) { renderSelector(); setInterval(() => { if (paso === 0 && !document.querySelector(".option")) renderSelector(); }, 60000); return; }
    const est = window.estadoVotacionMesa(mesa.numero);
    if (est.estado !== "abierta" && params.get("preview") !== "1") return renderNoDisponible(est);
    document.title = "Evaluar · Mesa " + mesa.numero + " | IX Simposio DPIP 2026";
    try { await V.ready(); } catch (e) {}
    let previo = null;
    try { previo = localStorage.getItem("ixdpip-eval-v2-" + mesa.key); } catch (e) {}
    if (previo && previo === String(V.uid())) return renderListo(true);
    render();
  }
  iniciar();
})();
</script>
</body>
</html>
